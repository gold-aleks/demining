<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101820">
  <meta name="description" content="3D-перегляд STL — Розмінування України">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EORE UA">
  <title>3D-модель — Розмінування України</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="app-header">
    <div class="container app-header__inner">
      <a class="brand" href="index.html" aria-label="На головну">
        <img class="brand__logo" src="img/logo.png" alt="" width="40" height="40">
        <span class="brand__text">
          <span class="brand__title">Розмінування України</span>
          <span class="brand__subtitle">3D-модель</span>
        </span>
      </a>
      <div class="header-actions">
        <button class="icon-btn" id="themeToggle" type="button" aria-label="Перемкнути тему" title="Тема">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container model-page">
    <div class="object-hero__nav">
      <button type="button" class="back-btn" id="backBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
        Назад
      </button>
      <label class="model-file-btn">
        <input id="modelFile" class="sr-only" type="file" accept=".glb,.gltf,.stl,model/gltf-binary,model/gltf,model/stl">
        Відкрити модель
      </label>
    </div>

    <h1 class="object-hero__title" id="modelTitle">ТМ-62</h1>
    <p class="object-hero__desc" id="modelDropHint">
      Обертайте модель мишею або пальцем. Колесо / щипок — масштаб. Можна перетягнути GLB або STL на сцену.
    </p>

    <div id="modelStage" class="stl-viewer stl-viewer--page"></div>
  </main>

  <footer class="app-footer">
    <div class="container">
      <p>Інформація лише для ознайомлення. Роботи з ВНП — лише для підготовлених фахівців.</p>
    </div>
  </footer>

  <script type="module" src="js/model-page.js"></script>
</body>
</html>
